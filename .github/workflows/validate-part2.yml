name: Validate Part 2 Submission

on:
  push:
    branches:
      - 'submissions/part2'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-part2:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make valgrind
    
    - name: 📋 Environment info
      run: |
        echo "## 🎯 Validation - Partie 2" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Étudiant:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
    
    - name: 🔨 Compile tests
      id: compile
      run: |
        echo "🔨 Compilation des tests Part 2..."
        make test-part2 2>&1 | tee compile.log
        if [ ${PIPESTATUS[0]} -eq 0 ]; then
          echo "✅ Compilation réussie"
          echo "compile_success=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Erreurs de compilation"
          echo "compile_success=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    - name: 🧪 Run tests - Part 2
      id: test_part2
      if: steps.compile.outputs.compile_success == 'true'
      continue-on-error: true
      run: |
        echo "🧪 Tests Part 2 (tableaux dynamiques)"
        ./test_part2 > test_part2.log 2>&1
        TEST_EXIT=$?
        cat test_part2.log
        
        # Parser les résultats Unity
        TESTS_RUN=$(grep "Tests Run:" test_part2.log | awk '{print $NF}')
        TESTS_PASSED=$(grep "Passed:" test_part2.log | awk '{print $NF}')
        TESTS_FAILED=$(grep "Failed:" test_part2.log | awk '{print $NF}')
        
        echo "tests_run=${TESTS_RUN:-0}" >> $GITHUB_OUTPUT
        echo "tests_passed=${TESTS_PASSED:-0}" >> $GITHUB_OUTPUT
        echo "tests_failed=${TESTS_FAILED:-0}" >> $GITHUB_OUTPUT
        
        if [ $TEST_EXIT -eq 0 ]; then
          echo "status=✅ PASS" >> $GITHUB_OUTPUT
          echo "exit_code=0" >> $GITHUB_OUTPUT
        else
          echo "status=❌ FAIL" >> $GITHUB_OUTPUT
          echo "exit_code=1" >> $GITHUB_OUTPUT
        fi
    
    - name: 🔍 Memory check - Valgrind
      id: valgrind
      if: steps.compile.outputs.compile_success == 'true'
      continue-on-error: true
      run: |
        echo "🔍 Vérification mémoire avec Valgrind..."
        
        # Test Part 2
        echo "Test Part 2:"
        valgrind --leak-check=full --errors-for-leak-kinds=all \
                 --show-leak-kinds=all ./test_part2 > valgrind_part2.log 2>&1
        
        # Vérifier les fuites en parsant la sortie (pas le exit code du programme)
        PART2_LEAKS=$(grep -m1 "definitely lost:" valgrind_part2.log | sed -E 's/.*definitely lost:[[:space:]]+([0-9,]+) bytes.*/\1/' | tr -d ',')
        
        PART2_LEAKS=${PART2_LEAKS:-0}
        
        echo "Part 2 leaks: $PART2_LEAKS bytes"
        
        # Toujours (ré)initialiser le résumé Valgrind
        : > valgrind_summary.txt

        # Si des logs sont manquants/vides, on considère cela comme un échec
        if [ ! -s valgrind_part2.log ]; then
          echo "Logs Valgrind manquants ou vides." >> valgrind_summary.txt
          echo "status=⚠️ Logs manquants" >> $GITHUB_OUTPUT
          echo "exit_code=1" >> $GITHUB_OUTPUT
        else
          if [ "$PART2_LEAKS" = "0" ]; then
            echo "Aucune fuite détectée ✅" >> valgrind_summary.txt
            echo "status=✅ OK" >> $GITHUB_OUTPUT
            echo "exit_code=0" >> $GITHUB_OUTPUT
          else
            {
              echo "Détails des fuites:"
              echo "Part 2 leaks: $PART2_LEAKS bytes"
              echo ""
              echo "---- Résumés Valgrind ----"
              grep -A 10 "LEAK SUMMARY" valgrind_part2.log || true
            } >> valgrind_summary.txt
            echo "status=❌ Fuites détectées" >> $GITHUB_OUTPUT
            echo "exit_code=1" >> $GITHUB_OUTPUT
          fi
        fi
    
    - name: 🎯 Calculate score
      id: score
      if: always()
      run: |
        # Récupérer les résultats des tests
        PART2_RUN=${{ steps.test_part2.outputs.tests_run }}
        PART2_PASSED=${{ steps.test_part2.outputs.tests_passed }}
        VALGRIND_OK=${{ steps.valgrind.outputs.exit_code }}

        # Fallback Valgrind: always re-parse logs to check actual leaks
        if [ -s valgrind_part2.log ]; then
          P2L=$(grep -m1 "definitely lost:" valgrind_part2.log | sed -E 's/.*definitely lost:[[:space:]]+([0-9,]+) bytes.*/\1/' | tr -d ',')
          P2L=${P2L:-0}
          echo "DEBUG: Parsed leaks - Part 2: $P2L bytes"
          if [ "$P2L" = "0" ]; then
            VALGRIND_OK=0
            echo "DEBUG: No leaks detected, setting VALGRIND_OK=0"
          else
            VALGRIND_OK=1
            echo "DEBUG: Leaks detected, setting VALGRIND_OK=1"
          fi
        else
          echo "DEBUG: Valgrind logs not found or empty"
        fi

        # Valeurs par défaut si non définies
        PART2_RUN=${PART2_RUN:-0}
        PART2_PASSED=${PART2_PASSED:-0}
        VALGRIND_OK=${VALGRIND_OK:-1}

        # Fallback robuste: reparser les logs Unity si nécessaire
        if [ "$PART2_RUN" = "0" ] && [ -s test_part2.log ]; then
          PART2_RUN=$(grep "Tests Run:" test_part2.log | awk '{print $NF}')
          PART2_PASSED=$(grep "Passed:" test_part2.log | awk '{print $NF}')
          PART2_RUN=${PART2_RUN:-0}
          PART2_PASSED=${PART2_PASSED:-0}
        fi
        
        # Total des tests
        TOTAL_TESTS=$PART2_RUN
        TOTAL_PASSED=$PART2_PASSED
        
        echo "Total tests: $TOTAL_TESTS"
        echo "Total passed: $TOTAL_PASSED"
        
        # Calcul du score sur 15 points
        if [ $TOTAL_TESTS -gt 0 ]; then
          # 13 points pour les tests (proportionnel)
          TESTS_SCORE=$(echo "scale=2; 13 * $TOTAL_PASSED / $TOTAL_TESTS" | bc)
          
          # 2 points pour Valgrind (bonus si pas de fuites)
          echo "DEBUG: VALGRIND_OK value before score calc: '$VALGRIND_OK'"
          if [ "$VALGRIND_OK" = "0" ]; then
            VALGRIND_SCORE=2
            echo "DEBUG: VALGRIND_OK=0, setting VALGRIND_SCORE=2"
          else
            VALGRIND_SCORE=0
            echo "DEBUG: VALGRIND_OK≠0 (value: $VALGRIND_OK), setting VALGRIND_SCORE=0"
          fi
          
          # Score total
          TOTAL_SCORE=$(echo "scale=2; $TESTS_SCORE + $VALGRIND_SCORE" | bc)
        else
          TOTAL_SCORE=0
        fi
        
        echo "score=$TOTAL_SCORE" >> $GITHUB_OUTPUT
        echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
        echo "total_passed=$TOTAL_PASSED" >> $GITHUB_OUTPUT
        echo "tests_score=$TESTS_SCORE" >> $GITHUB_OUTPUT
        echo "valgrind_score=$VALGRIND_SCORE" >> $GITHUB_OUTPUT
    
    - name: 📊 Generate detailed report
      if: always()
      run: |
        echo "# 📋 Rapport de Soumission - Partie 2" > report.md
        echo "" >> report.md
        echo "**Étudiant:** ${{ github.actor }}" >> report.md
        echo "**Date:** $(date '+%d %B %Y %H:%M:%S')" >> report.md
        echo "**Commit:** \`${{ github.sha }}\`" >> report.md
        echo "**Branche:** \`submissions/part2\`" >> report.md
        echo "" >> report.md
        echo "---" >> report.md
        echo "" >> report.md
        
        # Résultat global
        echo "## 🎯 Résultat Global" >> report.md
        echo "" >> report.md
        
        COMPILE="${{ steps.compile.outputs.compile_success }}"
        TOTAL_SCORE="${{ steps.score.outputs.score }}"
        TOTAL_TESTS="${{ steps.score.outputs.total_tests }}"
        TOTAL_PASSED="${{ steps.score.outputs.total_passed }}"
        TESTS_SCORE="${{ steps.score.outputs.tests_score }}"
        VALGRIND_SCORE="${{ steps.score.outputs.valgrind_score }}"
        PART2_STATUS="${{ steps.test_part2.outputs.exit_code }}"
        # Use VALGRIND_SCORE (0 or 2) to determine if there are leaks
        VALGRIND_HAS_LEAKS=$([ "$VALGRIND_SCORE" = "0" ] && echo "1" || echo "0")
        
        if [ "$COMPILE" != "true" ]; then
          echo "**Statut:** ❌ ÉCHEC COMPILATION" >> report.md
          echo "**Score:** 0/15 points" >> report.md
          echo "" >> report.md
          echo "Votre code ne compile pas. Consultez les logs ci-dessous." >> report.md
        else
          # Afficher le score
          echo "**Score:** 🎯 **${TOTAL_SCORE}/15 points**" >> report.md
          echo "" >> report.md
          echo "**Détail du score :**" >> report.md
          echo "- Tests unitaires : ${TESTS_SCORE}/13 points (${TOTAL_PASSED}/${TOTAL_TESTS} tests passés)" >> report.md
          echo "- Gestion mémoire : ${VALGRIND_SCORE}/2 points" >> report.md
          echo "" >> report.md
          
          # Statut en fonction du score
          SCORE_NUM=$(echo "$TOTAL_SCORE" | cut -d. -f1)
          if [ "$SCORE_NUM" -ge 15 ]; then
            echo "**Statut:** ✅ PARFAIT !" >> report.md
            echo "" >> report.md
            echo "🎉 **Félicitations !** Tous les tests sont passés sans erreur." >> report.md
          elif [ "$SCORE_NUM" -ge 10 ]; then
            echo "**Statut:** ✅ VALIDÉ" >> report.md
            echo "" >> report.md
            echo "👍 Bon travail ! Quelques points d'amélioration possibles." >> report.md
          elif [ "$SCORE_NUM" -ge 5 ]; then
            echo "**Statut:** ⚠️ PARTIELLEMENT VALIDÉ" >> report.md
            echo "" >> report.md
            echo "📚 Continuez vos efforts, vous êtes sur la bonne voie." >> report.md
          else
            echo "**Statut:** ❌ NON VALIDÉ" >> report.md
            echo "" >> report.md
            echo "💪 Ne vous découragez pas ! Consultez les recommandations ci-dessous." >> report.md
          fi
        fi
        
        echo "" >> report.md
        echo "---" >> report.md
        echo "" >> report.md
        
        # Détails des tests
        echo "## 🧪 Détail des Tests" >> report.md
        echo "" >> report.md
        echo "| Module | Tests | Statut | Détails |" >> report.md
        echo "|--------|-------|--------|---------|" >> report.md
        
        PART2_RUN="${{ steps.test_part2.outputs.tests_run }}"
        PART2_PASSED="${{ steps.test_part2.outputs.tests_passed }}"
        
        # Fallback: si des totaux sont vides, relire depuis les logs
        if [ -z "$PART2_RUN" ] || [ "$PART2_RUN" = "0" ]; then
          P2R=$(grep "Tests Run:" test_part2.log | awk '{print $NF}')
          P2P=$(grep "Passed:" test_part2.log | awk '{print $NF}')
          PART2_RUN=${P2R:-${PART2_RUN:-0}}
          PART2_PASSED=${P2P:-${PART2_PASSED:-0}}
        fi
        
        echo "| \`Tableaux dynamiques\` | ${PART2_PASSED:-0}/${PART2_RUN:-0} | ${{ steps.test_part2.outputs.status }} | [Voir logs](#logs-part2) |" >> report.md
        echo "| Mémoire (Valgrind) | - | ${{ steps.valgrind.outputs.status }} | [Voir logs](#logs-valgrind) |" >> report.md
        echo "" >> report.md
        
        # Analyse pédagogique
        if [ "$PART2_STATUS" != "0" ]; then
          echo "## 💡 Analyse et Recommandations" >> report.md
          echo "" >> report.md
          
          echo "### ⚠️ Tableaux dynamiques" >> report.md
          echo "" >> report.md
          echo "Certains tests ont échoué dans ce module. Voici quelques pistes :" >> report.md
          echo "" >> report.md
          echo "**Vérifications à faire :**" >> report.md
          echo "1. 🤔 La fonction \`createPlayerArray()\` initialise-t-elle correctement tous les champs ?" >> report.md
          echo "2. 🤔 La fonction \`addPlayer()\` gère-t-elle le redimensionnement avec \`realloc()\` ?" >> report.md
          echo "3. 🤔 La fonction \`removePlayerDynamic()\` libère-t-elle le joueur avant de décaler le tableau ?" >> report.md
          echo "4. 🤔 La fonction \`destroyPlayerArray()\` libère-t-elle tous les joueurs ET le tableau ?" >> report.md
          echo "" >> report.md
          echo "**Consultez les logs détaillés ci-dessous pour identifier les tests qui échouent.**" >> report.md
          echo "" >> report.md
          
          echo "### 📚 Ressources recommandées" >> report.md
          echo "" >> report.md
          echo "- 📖 Relisez les spécifications de la Partie 2" >> report.md
          echo "- 🎥 Consultez le cours sur les tableaux dynamiques et \`realloc()\`" >> report.md
          echo "- 💬 **Discutez-en avec l'enseignant** si vous êtes bloqué" >> report.md
          echo "" >> report.md
        fi
        
        if [ "$VALGRIND_HAS_LEAKS" = "1" ]; then
          echo "### 🔍 Fuites mémoire détectées" >> report.md
          echo "" >> report.md
          echo "Valgrind a détecté des fuites mémoire dans votre code." >> report.md
          echo "" >> report.md
          echo "**Questions à se poser :**" >> report.md
          echo "1. 🤔 Chaque \`malloc()\` et \`realloc()\` a-t-il un \`free()\` correspondant ?" >> report.md
          echo "2. 🤔 Les joueurs individuels sont-ils bien libérés avant de libérer le tableau ?" >> report.md
          echo "3. 🤔 La fonction \`destroyPlayerArray()\` est-elle complète ?" >> report.md
          echo "" >> report.md
          echo "**Consultez les logs Valgrind ci-dessous pour les détails.**" >> report.md
          echo "" >> report.md
        fi
        
        # Prochaines étapes
        echo "## 🔄 Prochaines Étapes" >> report.md
        echo "" >> report.md
        
        if [ "$PART2_STATUS" = "0" ] && [ "$VALGRIND_HAS_LEAKS" = "0" ]; then
          echo "### ✅ Validation réussie !" >> report.md
          echo "" >> report.md
          echo "🎉 Tous les tests de la Partie 2 sont validés." >> report.md
          echo "" >> report.md
          echo "Consultez le README pour la suite du projet." >> report.md
        else
          echo "### ⚠️ Corrections nécessaires" >> report.md
          echo "" >> report.md
          echo "Nous vous recommandons de corriger les erreurs avant de continuer." >> report.md
          echo "" >> report.md
          echo "**Plan d'action :**" >> report.md
          echo "" >> report.md
          echo "1. **Analyser les logs** ci-dessous pour identifier les problèmes" >> report.md
          echo "2. **Corriger le code** (fichiers dans \`src/\`)" >> report.md
          echo "3. **Tester localement** avec le script fourni :" >> report.md
          echo "" >> report.md
          echo "\`\`\`bash" >> report.md
          echo "./test-local.sh 2" >> report.md
          echo "\`\`\`" >> report.md
          echo "" >> report.md
          echo "4. **Sauvegarder vos modifications** :" >> report.md
          echo "" >> report.md
          echo "\`\`\`bash" >> report.md
          echo "./save.sh" >> report.md
          echo "\`\`\`" >> report.md
          echo "" >> report.md
          echo "5. **Resoummettre** :" >> report.md
          echo "" >> report.md
          echo "\`\`\`bash" >> report.md
          echo "./submit.sh 2" >> report.md
          echo "\`\`\`" >> report.md
        fi
        
        echo "" >> report.md
        echo "---" >> report.md
        echo "" >> report.md
        
        # Logs
        echo "## 📝 Logs Détaillés" >> report.md
        echo "" >> report.md
        
        echo "<a name=\"logs-part2\"></a>" >> report.md
        echo "### Tests Part 2" >> report.md
        echo "" >> report.md
        echo "\`\`\`" >> report.md
        cat test_part2.log >> report.md 2>/dev/null || echo "Aucun log disponible" >> report.md
        echo "\`\`\`" >> report.md
        echo "" >> report.md
        
        echo "<a name=\"logs-valgrind\"></a>" >> report.md
        echo "### Valgrind - Mémoire" >> report.md
        echo "" >> report.md
        echo "\`\`\`" >> report.md
        if [ -s valgrind_summary.txt ]; then
          cat valgrind_summary.txt >> report.md
        else
          echo "Résumé Valgrind indisponible (voir étapes ci-dessus) ⚠️" >> report.md
        fi
        echo "\`\`\`" >> report.md
        echo "" >> report.md
        
        # Footer
        echo "" >> report.md
        echo "---" >> report.md
        echo "*Rapport généré automatiquement par GitHub Actions*" >> report.md
    
    - name: 📤 Post report as comment
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('report.md', 'utf8');
          
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: report
          });
    
    - name: 📤 Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-part2
        path: |
          report.md
          test_part2.log
          valgrind_part2.log
          compile.log
    
    - name: 🏷️ Create validation tag
      if: steps.test_part2.outputs.exit_code == '0' && steps.valgrind.outputs.exit_code == '0'
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -a "submission-part2-validated" -m "Part 2 validated: ${{ github.sha }}"
        git push origin "submission-part2-validated" || echo "Tag already exists"
    
    - name: ✅ Final status
      if: always()
      run: |
        COMPILE="${{ steps.compile.outputs.compile_success }}"
        SCORE="${{ steps.score.outputs.score }}"
        
        echo ""
        echo "=========================================="
        echo "   RÉSULTAT FINAL - PARTIE 2"
        echo "=========================================="
        
        if [ "$COMPILE" != "true" ]; then
          echo "❌ Échec: Erreurs de compilation"
          echo "Score: 0/15"
          exit 1
        else
          echo "Score obtenu: ${SCORE}/15"
          
          # Convertir le score en entier pour la comparaison
          SCORE_INT=$(echo "$SCORE" | cut -d. -f1)
          
          if [ "$SCORE_INT" -ge 15 ]; then
            echo "✅ PARFAIT: Score maximum atteint !"
          elif [ "$SCORE_INT" -ge 10 ]; then
            echo "✅ VALIDÉ: Bon travail !"
          elif [ "$SCORE_INT" -ge 5 ]; then
            echo "⚠️ PARTIEL: Continuez vos efforts"
          else
            echo "❌ INSUFFISANT: Consultez le rapport"
          fi
          
          echo ""
          echo "Consultez le rapport détaillé pour plus d'informations."
          exit 0
        fi
